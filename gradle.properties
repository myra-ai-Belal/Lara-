# Project-wide Gradle settings.

# AndroidX package structure to make it clearer which packages are bundled
# with the Android operating system, and which are packaged with your
# app's APK. Required by the AndroidX dependencies used in this project
# (Compose, Room, Lifecycle, etc).
android.useAndroidX=true
android.enableJetifier=true

# Specifies the JVM arguments used for the daemon process.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable Gradle build cache for faster CI builds
org.gradle.caching=true

# Kotlin code style
kotlin.code.style=official

# Enables namespacing of each library's R class so that its R class includes
# only the resources declared in the library itself.
android.nonTransitiveRClass=true
